# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# GoReleaser v2 configuration (https://goreleaser.com/customization/).
# docs/project/release.md explains the release flow; in short, release-please
# creates the tag vX.Y.Z and its GitHub release, and the goreleaser job of
# .github/workflows/publish.yml runs `goreleaser release` at that tag, which
# adds to that release:
#   - the archives of touchmark for Linux, macOS and Windows on amd64 and
#     arm64, built with -trimpath, CGO off, the version, commit and commit
#     date stamped into `touchmark version`, and the commit time as their
#     mtime, so the same commit builds the same bytes;
#   - an SPDX SBOM of each archive (syft);
#   - checksums.txt, which lists them all, and its cosign keyless signature
#     bundle, checksums.txt.sigstore.json.
# The release's notes are release-please's, kept as they are. The image is
# not built here: publish.yml builds it from the Linux archives of the
# release (scripts/release/build-image.sh), so it holds their binary. Locally,
# `goreleaser release --snapshot --clean --skip=sign` builds the same files
# into dist/ and publishes nothing (docs/project/release.md).
version: 2

project_name: touchmark

builds:
  - id: touchmark
    main: ./cmd/touchmark
    binary: touchmark
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/bedrock-python/touchmark/internal/cli.Version={{ .Tag }}
      - -X github.com/bedrock-python/touchmark/internal/cli.Commit={{ .FullCommit }}
      - -X github.com/bedrock-python/touchmark/internal/cli.Date={{ .CommitDate }}
    # Reproducible: the binary's mtime is the commit's, not the build's.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: touchmark
    ids: [touchmark]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    # Fixed modes and mtimes: the archives do not depend on the checkout.
    files:
      - src: LICENSE
        info:
          mode: 0o644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mode: 0o644
          mtime: "{{ .CommitDate }}"

sboms:
  - id: archives
    artifacts: archive
    # syft's default adds --enrich all, which asks the network about the
    # module's dependencies; the SBOM is built from the binary alone.
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless: the certificate names the workflow that signed, publish.yml on
# master, which docs/project/release.md verifies with cosign verify-blob.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

# release-please writes the release notes and CHANGELOG.md from the
# conventional commits (release-please-config.json).
changelog:
  disable: true

release:
  github:
    owner: bedrock-python
    name: touchmark
  # The release exists: release-please created it, with the tag. goreleaser
  # finds it by the tag, keeps its notes (mode keep-existing) and its draft
  # and latest state, and uploads the files above to it. A re-run of the
  # publish workflow replaces the files a failed run left.
  mode: keep-existing
  replace_existing_artifacts: true
  prerelease: auto
  name_template: "{{ .Tag }}"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

report_sizes: true
