name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem would this feature solve? What use case drives it?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you'd like this to work, with an example configuration or command if possible.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you found any workarounds or alternative approaches?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Ownership, status and apply
        - Delivery (plan, distribute, sync pull requests)
        - Platform driver (GitHub, GitLab, Gitea, Forgejo, or a new one)
        - Configuration (hub.yml, targets.yml, opt-in file, operations)
        - Security (accounts, write isolation, setup, doctor, probe)
        - The GitHub Action or the container image
        - Documentation
        - Other
    validations:
      required: true
